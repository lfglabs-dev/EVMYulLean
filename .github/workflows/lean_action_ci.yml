name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python precompile dependencies
        run: python -m pip install coincurve typing-extensions pycryptodome eth-typing py-ecc
      - uses: leanprover/lean-action@v1
        with:
          test: false
