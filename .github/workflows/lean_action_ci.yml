name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python precompile dependencies
        run: python -m pip install coincurve==21.0.0 typing-extensions==4.15.0 pycryptodome==3.23.0 eth-typing==5.2.1 py-ecc==8.0.0
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - name: Build Conform and Yul test targets and run native Osaka CREATE2 checks
        run: |
          ~/.elan/bin/lake build Conform yulSemanticsTests EvmYul.FFI.ffi:dynlib Conform.Create2OsakaChecks
          out="$(~/.elan/bin/lake env lean --load-dynlib=.lake/build/lib/libleanffi.so --load-dynlib=.lake/build/lib/lean/evmyul_EvmYul_FFI_ffi.so --run Conform/Create2OsakaChecks.lean 2>&1)"
          printf '%s\n' "$out"
          test "$out" = "Osaka CREATE2 storage reset and nonce/code collision checks passed:4"
